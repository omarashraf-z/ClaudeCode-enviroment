<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummybears — mailer test</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 2rem 1.2rem; background: #0b0709; color: #fff6ea;
    font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; letter-spacing: .04em; margin: 0 0 .3rem; }
  p.sub { color: rgba(255,246,234,.55); margin: 0 0 1.6rem; }
  label { display: block; font-size: .7rem; letter-spacing: .18em;
          color: rgba(255,246,234,.55); margin: 1rem 0 .3rem; }
  input {
    font: inherit; width: 100%; padding: .7rem .8rem; color: inherit;
    background: rgba(255,246,234,.05); border: 1px solid rgba(255,246,234,.2);
    box-sizing: border-box;
  }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1.4rem 0; }
  button {
    font: inherit; font-weight: 500; padding: .8rem 1.2rem; cursor: pointer;
    background: #ff2d3f; color: #12060a; border: 0; letter-spacing: .06em;
  }
  button.ghost { background: transparent; color: inherit; border: 1px solid rgba(255,246,234,.25); }
  button:disabled { opacity: .5; cursor: wait; }
  pre {
    background: rgba(255,246,234,.05); border-left: 3px solid rgba(255,246,234,.2);
    padding: .9rem; white-space: pre-wrap; word-break: break-word; font-size: .82rem;
    margin: .8rem 0 0; max-height: 22rem; overflow: auto;
  }
  pre.ok   { border-left-color: #33ff6e; }
  pre.bad  { border-left-color: #ff2d3f; }
</style>
</head>
<body>
<main>
  <h1>MAILER TEST</h1>
  <p class="sub">
    Checks the Google Apps Script mailer directly, with nothing else in the
    way — no website, no Supabase. Open this file by double-clicking it.
  </p>

  <label for="url">WEB APP URL (ends in /exec)</label>
  <input id="url" value="https://script.google.com/macros/s/AKfycbwGBcEOS4cWalPALpqEaRVCsY3ldBDzfUmZv4UsLKc24Gr_EdLcWgE-Usw6eCYGJWM8/exec">

  <label for="email">YOUR EMAIL (the test mail goes here)</label>
  <input id="email" value="" placeholder="you@example.com">

  <div class="row">
    <button class="ghost" id="ping">0 · DIAGNOSE</button>
    <button class="ghost" id="pending">1 · SEND TEST "WE GOT IT" EMAIL</button>
    <button id="confirmed">2 · SEND TEST "CONFIRMED" EMAIL</button>
  </div>

  <pre id="out">Ready. Start with button 0 — it only reports, it sends nothing.</pre>
</main>

<script>
const $ = (id) => document.getElementById(id);
const out = $('out');

function show(text, kind) {
  out.textContent = text;
  out.className = kind || '';
}

function explain(error) {
  const message = String(error && error.message ? error.message : error);
  if (/Failed to fetch|NetworkError|Load failed/i.test(message)) {
    return [
      'The browser could not complete the request.',
      '',
      'That is almost always one of:',
      '  · the deployment is not set to "Who has access: Anyone"',
      '  · the URL is wrong, or is the /dev URL instead of /exec',
      '  · you are offline',
      '',
      'Raw error: ' + message
    ].join('\n');
  }
  return 'Raw error: ' + message;
}

$('ping').addEventListener('click', async () => {
  const button = $('ping');
  button.disabled = true;
  show('Asking the script what it can see…');
  try {
    const url = $('url').value.trim() + (($('url').value.indexOf('?') > -1) ? '&' : '?') + 'ping=1';
    const response = await fetch(url, { method: 'GET' });
    const text = await response.text();
    let verdict;
    try {
      const data = JSON.parse(text);
      verdict = data.ok
        ? '✓ THE SCRIPT IS HEALTHY.\n\n  running as : ' + data.runningAs + '\n  email      : ' + data.canSendEmail
        : '✕ THE SCRIPT RAN BUT REPORTED: ' + data.error;
    } catch {
      verdict = [
        '✕ THAT WAS NOT JSON — almost always a Google sign-in page.',
        '',
        'The deployment is not shared with "Anyone". Fix it with:',
        '  Deploy → Manage deployments → ✏️ → Who has access: Anyone → Deploy',
        '',
        'Also check you copied the /exec URL, not /dev.'
      ].join('\n');
    }
    show(verdict + '\n\nHTTP ' + response.status + '\n\n' + text.slice(0, 900), verdict[0] === '✓' ? 'ok' : 'bad');
  } catch (error) {
    show('✕ COULD NOT REACH THE SCRIPT AT ALL\n\n' + explain(error), 'bad');
  }
  button.disabled = false;
});

async function sendTest(type, buttonId) {
  const button = $(buttonId);
  const email = $('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    show('Put your email in the box first — the test mail is sent there.', 'bad');
    return;
  }
  button.disabled = true;
  show('Sending a test "' + type + '" email…');

  const payload = {
    type: type,
    name: 'TEST',
    email: email,
    party: 'TEST PARTY',
    ref: 'GB-TEST1',
    ticket: 'REGULAR',
    quantity: 1,
    ticketUrl: 'https://example.com/#/my-tickets'
  };

  try {
    const response = await fetch($('url').value.trim(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await response.text();
    let verdict;
    try {
      const data = JSON.parse(text);
      verdict = data.ok
        ? '✓ SENT. Check ' + email + '.'
        : '✕ The script ran but refused it: ' + data.error;
    } catch {
      verdict = '✕ The reply was not JSON — usually a sign-in page, which means\n'
              + '  the deployment is not shared with "Anyone".';
    }
    show(verdict + '\n\nHTTP ' + response.status + '\n\n' + text.slice(0, 900), verdict[0] === '✓' ? 'ok' : 'bad');
  } catch (error) {
    show('✕ COULD NOT REACH THE SCRIPT\n\n' + explain(error), 'bad');
  }
  button.disabled = false;
}

$('pending').addEventListener('click', () => sendTest('pending', 'pending'));
$('confirmed').addEventListener('click', () => sendTest('confirmed', 'confirmed'));
</script>
</body>
</html>
