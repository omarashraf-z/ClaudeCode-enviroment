# Publishes the front end to GitHub Pages as a self-contained demo: the React
# app with its in-browser backend (VITE_DEMO=1), so bookings work without the
# API being hosted anywhere. The real deployment is the whole stack — see
# the Dockerfile and the README.
name: Deploy demo to Pages

on:
  push:
    branches: [claude/gummybears-party-site-p1kjoh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the demo
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build -w @gummybears/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
