# Publishes the site to GitHub Pages on every push.
#
# Set a repository variable named RESERVATION_ENDPOINT (Settings → Secrets and
# variables → Actions → Variables) to point the reservation form at your Apps
# Script URL without committing it. If it is unset, the value in
# src/content.ts is used.
name: Deploy to Pages

on:
  push:
    branches: [claude/gummybears-party-site-p1kjoh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_RESERVATION_ENDPOINT: ${{ vars.RESERVATION_ENDPOINT }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
